spring:
  application:
    name: game-generation-platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/game_generation}
    username: ${DATABASE_USERNAME:game_generation}
    password: ${DATABASE_PASSWORD:game_generation}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://auth.invalid/}
          jwk-set-uri: ${AUTH0_JWK_SET_URI:https://auth.invalid/.well-known/jwks.json}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_RESULT_CONSUMER_GROUP:platform-api-generation-results-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
    listener:
      ack-mode: record

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    audience: ${AUTH0_AUDIENCE:https://api.game-generation.local}
    bootstrap-invited-emails: ${BOOTSTRAP_INVITED_EMAILS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  generation:
    request-topic: ${KAFKA_GENERATION_REQUEST_TOPIC:generation.execution.requested.v1}
    result-topic: ${KAFKA_GENERATION_RESULT_TOPIC:generation.execution.results.v1}
    outbox-publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}

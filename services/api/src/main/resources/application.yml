spring:
  application:
    name: game-generation-platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:game_generation}}
    username: ${DATABASE_USERNAME:game_generation}
    password: ${DATABASE_PASSWORD:game_generation}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://auth.invalid/}
          jwk-set-uri: ${AUTH0_JWK_SET_URI:https://auth.invalid/.well-known/jwks.json}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_RESULT_CONSUMER_GROUP:platform-api-generation-results-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
    listener:
      ack-mode: record

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    audience: ${AUTH0_AUDIENCE:https://api.game-generation.local}
    bootstrap-invited-emails: ${BOOTSTRAP_INVITED_EMAILS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  generation:
    request-topic: ${KAFKA_GENERATION_REQUEST_TOPIC:generation.execution.requested.v1}
    retry-topic: ${KAFKA_GENERATION_RETRY_TOPIC:generation.execution.retry.v1}
    result-topic: ${KAFKA_GENERATION_RESULT_TOPIC:generation.execution.results.v1}
    dlq-topic: ${KAFKA_GENERATION_DLQ_TOPIC:generation.execution.dlq.v1}
    max-attempts: ${GENERATION_MAX_ATTEMPTS:3}
    timeout-seconds: ${GENERATION_TIMEOUT_SECONDS:900}
    cancellation-grace-seconds: ${GENERATION_CANCELLATION_GRACE_SECONDS:5}
    sweep-delay-ms: ${GENERATION_SWEEP_DELAY_MS:5000}
    outbox-publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}
  content-pack:
    request-topic: ${KAFKA_PACK_EXPORT_REQUEST_TOPIC:content-pack.export.requested.v1}
    result-topic: ${KAFKA_PACK_EXPORT_RESULT_TOPIC:content-pack.export.results.v1}
    artifact-bucket: ${S3_BUCKET:forge-generation-assets}
  credits:
    initial-project-grant: ${CREDIT_INITIAL_PROJECT_GRANT:100}
    generation-cost: ${CREDIT_GENERATION_COST:10}
    ledger-limit: ${CREDIT_LEDGER_LIMIT:50}

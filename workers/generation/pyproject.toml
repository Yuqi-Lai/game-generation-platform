[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-generation-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.40.40",
  "confluent-kafka==2.11.1",
  "google-genai==2.25.0",
  "pillow==11.3.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.11.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
generation-worker = "generation_worker.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

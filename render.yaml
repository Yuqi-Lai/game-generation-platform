services:
  - type: web
    name: forge-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: forge-postgres
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: forge-postgres
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: forge-postgres
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: forge-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: forge-postgres
          property: password
      - key: AUTH0_ISSUER_URI
        sync: false
      - key: AUTH0_JWK_SET_URI
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: BOOTSTRAP_INVITED_EMAILS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: forge-postgres
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: "16"
    databaseName: forge
    user: forge
    ipAllowList: []

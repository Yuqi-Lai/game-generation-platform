name: forge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: game_generation
      POSTGRES_USER: game_generation
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - forge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_generation -d game_generation"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../services/api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/game_generation
      DATABASE_USERNAME: game_generation
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local_only_change_me}
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:-https://example.auth0.com/}
      AUTH0_JWK_SET_URI: ${AUTH0_JWK_SET_URI:-https://example.auth0.com/.well-known/jwks.json}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.game-generation.local}
      BOOTSTRAP_INVITED_EMAILS: ${BOOTSTRAP_INVITED_EMAILS:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REALTIME_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ../../apps/web
    environment:
      API_BASE_URL: http://api:8080
      APP_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-example.auth0.com}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-development-client-id}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-development-client-secret}
      AUTH0_SECRET: ${AUTH0_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.game-generation.local}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  redpanda:
    image: redpandadata/redpanda:v25.2.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - forge_s3:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  generation-worker:
    build:
      context: ../../workers/generation
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-development-key-required-for-generation}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      S3_BUCKET: forge-generation-assets
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://s3:4566
      S3_FORCE_PATH_STYLE: "true"
      PLAYABLE_ASSET_BASE_URL: http://localhost:4566/forge-generation-assets/
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
    depends_on:
      redpanda:
        condition: service_healthy
      s3:
        condition: service_healthy

volumes:
  forge_postgres:
  forge_s3:

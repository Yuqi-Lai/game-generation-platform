name: forge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: game_generation
      POSTGRES_USER: game_generation
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - forge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_generation -d game_generation"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../services/api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/game_generation
      DATABASE_USERNAME: game_generation
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local_only_change_me}
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:-https://example.auth0.com/}
      AUTH0_JWK_SET_URI: ${AUTH0_JWK_SET_URI:-https://example.auth0.com/.well-known/jwks.json}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.game-generation.local}
      BOOTSTRAP_INVITED_EMAILS: ${BOOTSTRAP_INVITED_EMAILS:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ../../apps/web
    environment:
      API_BASE_URL: http://api:8080
      APP_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-example.auth0.com}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-development-client-id}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-development-client-secret}
      AUTH0_SECRET: ${AUTH0_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.game-generation.local}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  forge_postgres:
